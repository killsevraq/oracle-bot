[project]
name = "oracle-bot"
version = "0.1.0"
description = "Oracle Bot V2 - Bot automatise de paris sur Bitcoin (Binance + Polymarket)."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "killsevraq" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "websockets>=12.0",
    "httpx>=0.27",
    "python-telegram-bot>=21.4",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]
prod = [
    "py-clob-client>=0.17",
]

[project.scripts]
oracle-bot = "backend.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
disallow_untyped_defs = false
